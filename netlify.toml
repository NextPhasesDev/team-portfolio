# Netlify Configuration for NextPhases
# This file controls redirects, headers, and deployment rules

[build]
  command = "echo 'Static site - no build needed'"
  publish = "."
  edge_functions = "netlify/edge-functions"

# Direct navigation to source files is bounced to the homepage by the
# asset-guard edge function. It cannot be done with [[redirects]]: without
# force = true the rule never fires because the file exists, and with
# force = true the site's own <link> and <script> tags break too.
# See netlify/edge-functions/asset-guard.js.

[[redirects]]
  from = "/scripts/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/styles/*"
  to = "/"
  status = 301
  force = true

# Clean URLs
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200

[[redirects]]
  from = "/portfolio"
  to = "/portfolio.html"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/testimonials"
  to = "/testimonials.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# Add security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache policy for assets
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Logo_transparent.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML files get shorter cache
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Rates cache is refreshed daily by the client, so keep it short
[[headers]]
  for = "/rates.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
